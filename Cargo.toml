[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
trace-core = { path = "crates/trace-core" }
adapter-claude-code = { path = "crates/adapter-claude-code" }
trace-view = { path = "crates/trace-view" }
capture-core = { path = "crates/capture-core" }
capture = { path = "crates/capture" }
flate2 = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0.21"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = { version = "0.1", features = ["channel"] }
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
